apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-sleep
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: busybox-sleep
  template:
    metadata:
      labels:
        app: busybox-sleep
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]